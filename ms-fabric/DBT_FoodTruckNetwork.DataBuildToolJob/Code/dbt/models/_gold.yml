models:
  - name: dim_customers
    description: >
      Customer dimension model configured as incremental that combines Customer ID column.

      Key transformations:
        - Filtering new records incrementally based on Loaded at (UTC) column.
        - Deduplicating values across all columns.
        - Generating a surrogate key from Customer ID column.
      
      Used as the dimension model in gold layer for reporting and analysis.
    columns:
      - name: Customer Key
        quote: true
        description: >
          Surrogate key of dim_customers.
        tests:
          - not_null
          - unique

      - name: Customer ID
        quote: true
        description: >
          Unique customer identification. Natural key for each customer generated by source system.
        tests:
          - not_null
          - unique

      - name: Birthday Date
        quote: true
        description: >
          Birth date of customer, formatted as ISO format, yyyy-mm-dd (e.g. 1979-01-31).
        tests:
          - not_null

      - name: First Name
        quote: true
        description: >
          First name of customer. An Guest value means that customer did not disclose it or does not have a first name.
        tests:
          - not_null

      - name: Last Name
        quote: true
        description: >
          Last name of customer.
        tests:
          - not_null

      - name: Full Name
        quote: true
        description: >
          Full name of customer, formatted as First Name Last Name.
        tests:
          - not_null

      - name: Last First Name
        quote: true
        description: >
          Last first name of customer, formatted as Last Name, First Name.
        tests:
          - not_null

      - name: Gender
        quote: true
        description: >
          Gender of customer, classified as Male, Female, or Undisclosed.
        tests:
          - not_null

      - name: Marital Status
        quote: true
        description: >
          Marital status of customer, classified as Single, Divorced/Seperated, Married, or Undisclosed.
        tests:
          - not_null

      - name: Email
        quote: true
        description: >
          Email used by customer.
        tests:
          - not_null

      - name: Phone Number
        quote: true
        description: >
          Phone number used by customer.
        tests:
          - not_null

      - name: Children Amount
        quote: true
        description: >
          Number of children belonging to customer, classified as 1, 3, 4, 5+, 2, Undisclosed, or 0.
        tests:
          - not_null

      - name: City
        quote: true
        description: >
          City where the customer is located, with values such as Vancouver, Madrid, Cairo, etc.
        tests:
          - not_null

      - name: Country
        quote: true
        description: >
          Country where the customer is located, with values such as Poland, Spain, Sweden, etc.
        tests:
          - not_null

      - name: Postal Code
        quote: true
        description: >
          Postal code where the customer is located.
        tests:
          - not_null

      - name: Preferred Language
        quote: true
        description: >
          Language used by customer, with values such as German, Portuguese, Korean, etc.
        tests:
          - not_null

      - name: Favorite Brand
        quote: true
        description: >
          Brand that customers love. All current values are Undisclosed.
        tests:
          - not_null

      - name: Sign Up Date
        quote: true
        description: >
          Date of when customer signed up, formatted as ISO format, yyyy-mm-dd (e.g. 1979-01-31).
        tests:
          - not_null

      - name: Loaded at (UTC)
        quote: true
        description: >
          Timestamp of when this record was loaded to the bronze source, formatted as yyyy-mm-dd hh:mi:ss.mmmmmm (e.g. 1979-01-31 24:30:01.816148).
        tests:
          - not_null
  

