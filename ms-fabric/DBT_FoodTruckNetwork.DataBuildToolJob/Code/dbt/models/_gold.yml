  - name: dim_order_date
    description: >
      Date dimension model materialized as a table that builds a order date dimension from order timestamp.

      Key transformations:
        - Getting all unique dates by casting order timestamp as date type.
        - Extracting date parts (year, quarter, month, day) from each date.
        - Using Order Date column as surrogate key.

      Hierarchy:
        1) Year
        2) Quarter
        3) Month
        4) Day
      
      Used as the dimension model in gold layer for reporting and analysis.
    columns:
      - name: Order Date
        quote: true
        description: ''
        tests:
          - not_null
          - unique

      - name: Day
        quote: true
        description: ''
        tests:
          - not_null

      - name: Month
        quote: true
        description: ''
        tests:
          - not_null

      - name: Quarter
        quote: true
        description: ''
        tests:
          - not_null

      - name: Year
        quote: true
        description: ''
        tests:
          - not_null
      
      - name: Day of Week
        quote: true
        description: ''
        tests:
          - not_null
      
      - name: Day of Week Sorting
        quote: true
        description: ''
        tests:
          - not_null

      - name: Month Year
        quote: true
        description: ''
        tests:
          - not_null



