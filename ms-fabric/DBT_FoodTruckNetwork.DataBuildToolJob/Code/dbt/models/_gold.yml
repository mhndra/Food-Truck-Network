  - name: fact_order_details
    description: >
      Fact model configured as incremental that builds the central order details fact table and links across dimension tables.

      Grain:
        Each row represents a single order line detail (Order Detail ID) placed by a customer (specifying the order's delivery location) for a specific menu item, at a specific date and time, to be picked up by spesific truck from the selected franchise owner.
      
      Key transformations:
        - Filtering new records incrementally based on Loaded at (UTC) column.
        - Getting natural keys from order_header_renamed and truck_enriched models in silver layer.
        - Generating a surrogate key from nine grain columns.
        - Replacing natural keys with surrogate keys by joining to dim_customers, dim_franchise_owners, dim_menu_items, dim_locations, dim_trucks, dim_order_date, and dim_order_time.

      Used as the central fact table in gold layer for detailed order reporting and sales analysis.
    columns:
      - name: Order Detail Key
        quote: true
        description: ''
        tests:
          - not_null
          - unique

      - name: Customer DBT SCD ID
        quote: true
        description: ''
        tests:
          - not_null
          - relationships:
              to: "{{ ref('dim_customers_snapshot') }}"
              field: dbt_scd_id
          

      - name: Franchise Owner DBT SCD ID
        quote: true
        description: ''
        tests:
          - not_null
          - relationships:
              to: "{{ ref('dim_franchise_owners_snapshot') }}"
              field: dbt_scd_id

      - name: Menu Item Key
        quote: true
        description: ''
        tests:
          - not_null
          - relationships:
              to: "{{ ref('dim_menu_items') }}"
              field: '"Menu Item Key"'

      - name: Location Key
        quote: true
        description: ''
        tests:
          - not_null
          - relationships:
              to: "{{ ref('dim_locations') }}"
              field: '"Location Key"'

      - name: Truck Key
        quote: true
        description: ''
        tests:
          - not_null
          - relationships:
              to: "{{ ref('dim_trucks') }}"
              field: '"Truck Key"'

      - name: Order Detail ID
        quote: true
        description: ''
        tests:
          - not_null
          - unique

      - name: Order ID
        quote: true
        description: ''
        tests:
          - not_null

      - name: Order Date
        quote: true
        description: ''
        tests:
          - not_null

      - name: Order Time
        quote: true
        description: ''
        tests:
          - not_null

      - name: Quantity
        quote: true
        description: ''
        tests:
          - not_null

      - name: Unit Price (USD)
        quote: true
        description: ''
        tests:
          - not_null

      - name: Total Price (USD)
        quote: true
        description: ''
        tests:
          - not_null

      - name: Loaded at (UTC)
        quote: true
        description: ''
        tests:
          - not_null


  - name: fact_order_headers
    description: >
      Fact model configured as incremental that builds the central summary orders fact table and links across dimension tables.

      Grain:
        Each row represents a single order (Order ID) placed by a customer (specifying the order's delivery location) at a specific date and time, to be picked up by spesific truck from the selected franchise owner.
      
      Key transformations:
        - Grouping into order-level from detailed order, fact_order_details model in gold layer.  
        - Summarizing amount of orders, total order quantities, and total order price.
        - Generating a surrogate key from Order ID column.

      Used as the central fact table in gold layer for order-level reporting and sales analysis.
    columns:
      - name: Order Key
        quote: true
        description: ''
        tests:
          - not_null
          - unique

      - name: Customer DBT SCD ID
        quote: true
        description: ''
        tests:
          - not_null

      - name: Franchise Owner DBT SCD ID
        quote: true
        description: ''
        tests:
          - not_null

      - name: Location Key
        quote: true
        description: ''
        tests:
          - not_null

      - name: Truck Key
        quote: true
        description: ''
        tests:
          - not_null

      - name: Order ID
        quote: true
        description: ''
        tests:
          - not_null
          - unique

      - name: Order Date
        quote: true
        description: ''
        tests:
          - not_null

      - name: Order Time
        quote: true
        description: ''
        tests:
          - not_null

      - name: Order Amount
        quote: true
        description: ''
        tests:
          - not_null

      - name: Total Order Quantities
        quote: true
        description: ''
        tests:
          - not_null

      - name: Total Order Price (USD)
        quote: true
        description: ''
        tests:
          - not_null

