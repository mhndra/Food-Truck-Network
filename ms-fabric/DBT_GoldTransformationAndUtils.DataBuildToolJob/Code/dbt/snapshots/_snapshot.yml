snapshots:
  - name: dim_customers_snapshot
    description: ""
    relation: ref('dim_customers')
    config:
      schema: gold
      strategy: check
      unique_key: '"Customer Key"'
      check_cols:
        - '"Customer ID"'
        - '"Birthday Date"'
        - '"First Name"'
        - '"Last Name"'
        - '"Full Name"'
        - '"Last First Name"'
        - 'Gender'
        - '"Marital Status"'
        - 'Email'
        - '"Phone Number"'
        - '"Children Amount"'
        - 'City'
        - 'Country'
        - '"Postal Code"'
        - '"Preferred Language"'
        - '"Favorite Brand"'
        - '"Sign Up Date"'
        - '"Loaded at (UTC)"'
    columns:
      - name: Customer ID
        quote: true

      - name: Birthday Date
        quote: true

      - name: First Name
        quote: true

      - name: Last Name
        quote: true

      - name: Full Name
        quote: true

      - name: Last First Name
        quote: true

      - name: Gender
        quote: true

      - name: Marital Status
        quote: true

      - name: Email
        quote: true

      - name: Phone Number
        quote: true

      - name: Children Amount
        quote: true

      - name: City
        quote: true

      - name: Country
        quote: true

      - name: Postal Code
        quote: true

      - name: Preferred Language
